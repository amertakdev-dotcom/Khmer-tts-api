
<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khmer AI TTS</title>

<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Kantumruy Pro",sans-serif;
}

body{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

background:
radial-gradient(circle at top,#2563eb55,transparent 40%),
linear-gradient(135deg,#020617,#111827);

color:white;

}


.card{

width:100%;
max-width:700px;

background:#ffffff10;

backdrop-filter:blur(20px);

border:1px solid #ffffff20;

border-radius:25px;

padding:30px;

box-shadow:0 25px 70px #0008;

}


.logo{

font-size:50px;
text-align:center;

}


h1{

text-align:center;
margin-top:10px;

}


.subtitle{

text-align:center;
opacity:.7;
margin:10px 0 30px;

}



label{

display:block;
margin-bottom:8px;
font-weight:600;

}


textarea{

width:100%;
height:170px;

padding:18px;

border-radius:18px;

background:#020617;

border:1px solid #334155;

color:white;

font-size:16px;

resize:none;

outline:none;

}



.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

margin-top:20px;

}



select{

width:100%;

padding:14px;

border-radius:15px;

background:#020617;

border:1px solid #334155;

color:white;

}



button{

width:100%;

margin-top:25px;

padding:16px;

border:0;

border-radius:18px;

background:linear-gradient(
90deg,
#2563eb,
#9333ea
);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



button:hover{

transform:translateY(-2px);

}



.status{

text-align:center;

margin-top:20px;

}



audio{

width:100%;

margin-top:20px;

}



.download{

display:none;

margin-top:15px;

padding:14px;

text-align:center;

background:#16a34a;

color:white;

text-decoration:none;

border-radius:15px;

font-weight:bold;

}



@media(max-width:600px){

.row{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
🎙️
</div>


<h1>
Khmer AI Voice
</h1>


<div class="subtitle">
Piseth & Sreymom Neural Voice
</div>



<label>
បញ្ចូលអត្ថបទ
</label>


<textarea id="text">
សួស្តី! នេះគឺជា Khmer AI Text To Speech។
</textarea>



<div class="row">


<div>

<label>
Voice
</label>


<select id="voice">

<option value="km-KH-PisethNeural">
👨 Piseth
</option>


<option value="km-KH-SreymomNeural">
👩 Sreymom
</option>


</select>

</div>


<div>

<label>
Language
</label>


<select disabled>

<option>
🇰🇭 Khmer Cambodia
</option>

</select>


</div>


</div>



<button onclick="generate()">

✨ Generate Voice

</button>



<div class="status" id="status"></div>


<audio id="audio" controls></audio>


<a id="download" class="download" download="khmer-voice.mp3">
⬇ Download MP3
</a>



</div>



<script>


const API =
"https://khmer-tts-api.onrender.com/tts";



async function generate(){


const text =
document.getElementById("text").value;


const voice =
document.getElementById("voice").value;


const status =
document.getElementById("status");


const audio =
document.getElementById("audio");


const download =
document.getElementById("download");



if(!text){

status.innerHTML="❌ សូមបញ្ចូលអត្ថបទ";

return;

}



status.innerHTML="⏳ Creating voice...";



try{


const response = await fetch(API,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

text:text,

voice:voice

})

});



if(!response.ok){

throw new Error("API Error");

}



const blob =
await response.blob();



const url =
URL.createObjectURL(blob);



audio.src=url;


audio.play();



download.href=url;


download.style.display="block";



status.innerHTML="✅ Done";


}

catch(err){


console.error(err);


status.innerHTML=
"❌ Failed: "+err.message;


}



}


</script>


</body>
</html>
